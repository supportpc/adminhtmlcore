<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - NusaCore</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:16px}
    .login-card{display:grid;grid-template-columns:1fr 1fr;max-width:820px;width:100%;border-radius:18px;overflow:hidden;box-shadow:0 14px 45px rgba(15,23,42,.12);background:var(--bg-white)}
    .login-brand{background:linear-gradient(135deg,#2563eb,#7c3aed);color:white;padding:36px;display:flex;flex-direction:column;justify-content:center;gap:10px}
    .login-brand h1{font-size:28px;font-weight:900;letter-spacing:-.04em;line-height:1.2}
    .login-brand p{font-size:14px;opacity:.8;line-height:1.5}
    .login-brand .brand-icon{font-size:42px;margin-bottom:6px}
    .login-brand .brand-features{display:flex;flex-direction:column;gap:8px;margin-top:16px}
    .login-brand .brand-features span{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
    .login-brand .brand-features i{color:rgba(255,255,255,.7);font-size:12px}
    .login-form{padding:36px;display:flex;flex-direction:column;justify-content:center}
    .login-form h2{font-size:20px;font-weight:800;margin-bottom:4px}
    .login-form .form-subtitle{font-size:13px;color:var(--text-muted);margin-bottom:20px}
    .social-login{display:flex;gap:8px;margin-bottom:16px}
    .social-login .btn{flex:1;justify-content:center;padding:9px;font-size:13px;font-weight:700}
    .auth-divider{display:flex;align-items:center;gap:12px;margin-bottom:16px;font-size:12px;color:var(--text-muted)}
    .auth-divider::before,.auth-divider::after{content:"";flex:1;height:1px;background:var(--border-normal)}
    .login-form .form-footer{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-size:13px}
    .login-form .form-footer a{color:var(--primary);font-weight:700}
    .login-form .login-btn{width:100%;margin-top:12px;padding:10px;font-size:14px}
    body.dark-mode .login-page{background:linear-gradient(135deg,#020617,#111827)}
    body.dark-mode .login-card{background:#1e293b}
    @media(max-width:640px){.login-card{grid-template-columns:1fr}.login-brand{display:none}.login-form{padding:24px}}
  </style>
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-icon"><i class="fa-solid fa-cube"></i></div>
      <h1>NusaCore</h1>
      <p>Panel administrasi all-in-one untuk kelola user, transaksi, laporan, dan pengaturan sistem.</p>
      <div class="brand-features">
        <span><i class="fa-solid fa-check-circle"></i> Manajemen User & Role</span>
        <span><i class="fa-solid fa-check-circle"></i> Monitoring Transaksi Real-time</span>
        <span><i class="fa-solid fa-check-circle"></i> Laporan & Audit Trail</span>
        <span><i class="fa-solid fa-check-circle"></i> Multi-level Permission</span>
      </div>
    </div>
    <div class="login-form">
      <h2>Sign in</h2>
      <p class="form-subtitle">Masuk ke admin panel Anda</p>
      
      <div class="social-login">
        <button class="btn btn-secondary" onclick="showToast('Google login')"><i class="fa-brands fa-google"></i> Google</button>
        <button class="btn btn-secondary" onclick="showToast('GitHub login')"><i class="fa-brands fa-github"></i> GitHub</button>
      </div>
      
      <div class="auth-divider">atau login dengan email</div>
      
      <div class="form-group">
        <label class="form-label">Email</label>
        <input class="form-control" type="email" placeholder="admin@example.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-control" type="password" placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;" autocomplete="current-password">
      </div>
      
      <label class="form-check">
        <input class="form-check-input" type="checkbox" checked>
        <span class="form-check-label">Remember me</span>
      </label>
      
      <button class="btn btn-primary login-btn" onclick="window.location.href='index.html'">Login ke Dashboard</button>
      
      <div class="form-footer">
        <a href="#">Lupa password?</a>
        <a href="#">Buat akun baru</a>
      </div>
    </div>
  </div>
  
  <div class="toast" id="toast"></div>
  <script src="js/app.js"></script>
</body>
</html>
